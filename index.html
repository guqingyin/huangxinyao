<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05051f">
    <title>💖 星河之旅 · 七夕特典 💖</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="top-nav">
        <a href="index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="home-scene" id="home-scene">
        <div class="home-title">七 夕 快 乐</div>
        <div class="home-subtitle">✨ 纤云弄巧 · 飞星传恨 ✨</div>

        <!-- 倒计时卡片 -->
        <div class="countdown-card" id="countdownCard">
            <div class="countdown-label">💖 在一起</div>
            <div class="countdown-days" id="countdownDays">—</div>
            <div class="countdown-unit">天</div>
        </div>

        <div class="star-nav">
            <div class="moon" id="moon"><span class="moon-text">🌙</span></div>
            <a href="pages/meet.html" class="star-item star-1" data-page="meet">✨<span class="star-label">初见馆</span></a>
            <a href="pages/memories.html" class="star-item star-2" data-page="memories">✨<span class="star-label">回忆册</span></a>
            <a href="pages/love.html" class="star-item star-3" data-page="love">✨<span class="star-label">告白屋</span></a>
            <a href="pages/wish.html" class="star-item star-4" data-page="wish">✨<span class="star-label">心愿星</span></a>
            <a href="pages/secret.html" class="star-item star-5" data-page="secret">✨<span class="star-label">秘密匣</span></a>
        </div>

        <!-- 联机入口 -->
        <div class="room-panel" id="roomPanel">
            <div class="room-panel-title">💕 双人联机</div>
            <div class="room-panel-desc">一起探索星河</div>
            <div class="room-buttons">
                <button class="room-btn create-btn" id="createRoomBtn">创建房间</button>
                <button class="room-btn join-btn" id="joinRoomBtn">加入房间</button>
            </div>
            <div class="join-form" id="joinForm" style="display:none;">
                <input type="text" class="room-input" id="roomInput" placeholder="房间号" maxlength="20">
                <input type="password" class="room-input" id="passcodeInput" placeholder="邀请码" maxlength="4">
                <button class="room-btn join-confirm-btn" id="joinConfirmBtn">进入</button>
            </div>
            <div class="room-info" id="roomInfo" style="display:none;">
                <div class="room-info-row"><span class="room-info-label">房间号</span><span class="room-info-value" id="roomInfoId">-</span></div>
                <div class="room-info-row"><span class="room-info-label">邀请码</span><span class="room-info-value" id="roomInfoPasscode">-</span></div>
                <div class="room-info-row"><span class="room-info-label">链接</span><span class="room-info-value room-info-link" id="roomInfoLink">点击复制</span></div>
                <div class="room-info-tip">把房间号和邀请码发给TA吧～</div>
            </div>
        </div>

        <!-- 留言板 -->
        <div class="message-board" id="messageBoard">
            <div class="message-board-title">📝 留言板</div>
            <div class="message-list" id="messageList"></div>
            <div class="message-form">
                <input type="text" class="message-input" id="messageInput" placeholder="写下你想说的话..." maxlength="50">
                <button class="message-send-btn" id="messageSendBtn">发送</button>
            </div>
        </div>
    </div>

    <div class="mobile-tab" id="mobileTab">
        <a href="index.html" class="active-tab"><span class="tab-icon">🏠</span>首页</a>
        <a href="pages/meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="pages/memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="pages/love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="pages/wish.html"><span class="tab-icon">⭐</span>心愿</a>
    </div>

    <script src="js/main.js?v3"></script>
    <script src="js/online.js?v3"></script>
    <script>
    (function() {
        'use strict';

        /* ---------- 模块：倒计时天数 ---------- */
        // 从 localStorage 读取纪念日，默认 2026-08-18
        function getAnniversary() {
            return localStorage.getItem('anniversary') || '2026-08-18';
        }
        function calcDays() {
            const start = new Date(getAnniversary());
            const now = new Date();
            const diff = Math.floor((now - start) / 86400000);
            return diff >= 0 ? diff : 0;
        }
        document.getElementById('countdownDays').textContent = calcDays();

        /* ---------- 模块：月亮彩蛋 ---------- */
        let moonClickCount = 0;
        const moon = document.getElementById('moon');
        if (moon) {
            moon.addEventListener('click', () => {
                moonClickCount++;
                if (moonClickCount >= 5) {
                    moonClickCount = 0;
                    navigateTo('secret');
                }
            });
        }

        /* ---------- 模块：导航（携带 room 参数） ---------- */
        function navigateTo(page) {
            const room = Online.getRoomId();
            const url = (page === 'index' ? 'index.html' : 'pages/' + page + '.html') + (room ? '?room=' + room : '');
            window.location.href = url;
        }
        document.querySelectorAll('.star-item').forEach(star => {
            star.addEventListener('click', (e) => { e.preventDefault(); navigateTo(star.dataset.page); });
        });
        document.querySelectorAll('.mobile-tab a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.getAttribute('href');
                const room = Online.getRoomId();
                window.location.href = href + (room ? '?room=' + room : '');
            });
        });

        /* ---------- 模块：创建房间 ---------- */
        document.getElementById('createRoomBtn').addEventListener('click', async () => {
            const roomId = Online.generateRoomId();
            const passcode = Online.generatePasscode();
            document.getElementById('roomInfoId').textContent = roomId;
            document.getElementById('roomInfoPasscode').textContent = passcode;
            const link = window.location.origin + window.location.pathname + '?room=' + roomId;
            document.getElementById('roomInfoLink').dataset.link = link;
            document.getElementById('roomInfoLink').textContent = '点击复制';
            document.getElementById('roomInfo').style.display = 'block';
            document.getElementById('joinForm').style.display = 'none';
            await Online.createRoom(roomId, passcode);
            window.history.replaceState({}, '', window.location.pathname + '?room=' + roomId);
            document.getElementById('roomInfoLink').addEventListener('click', () => {
                const text = document.getElementById('roomInfoLink').dataset.link;
                navigator.clipboard.writeText(text).then(() => {
                    document.getElementById('roomInfoLink').textContent = '已复制!';
                    setTimeout(() => { document.getElementById('roomInfoLink').textContent = '点击复制'; }, 2000);
                });
            });
        });

        /* ---------- 模块：加入房间 ---------- */
        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            document.getElementById('joinForm').style.display = 'flex';
            document.getElementById('roomInfo').style.display = 'none';
            document.getElementById('roomInput').focus();
        });
        document.getElementById('joinConfirmBtn').addEventListener('click', async () => {
            const roomId = document.getElementById('roomInput').value.trim();
            const passcode = document.getElementById('passcodeInput').value.trim();
            if (roomId && passcode) {
                document.getElementById('joinConfirmBtn').textContent = '连接中...';
                await Online.joinRoom(roomId, passcode);
                window.history.replaceState({}, '', window.location.pathname + '?room=' + roomId);
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('joinConfirmBtn').textContent = '进入';
            } else { alert('请输入房间号和邀请码'); }
        });
        document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('joinConfirmBtn').click();
        });

        /* ---------- 模块：URL 有 room 参数时 ---------- */
        const existingRoom = Online.getRoomId();
        if (existingRoom) {
            document.getElementById('createRoomBtn').style.display = 'none';
            document.getElementById('joinRoomBtn').style.display = 'none';
            document.getElementById('joinForm').style.display = 'flex';
            document.getElementById('roomInput').value = existingRoom;
            document.getElementById('passcodeInput').focus();
        }

        /* ---------- 模块：留言板 ---------- */
        const messages = JSON.parse(localStorage.getItem('messages') || '[]');
        function renderMessages() {
            const list = document.getElementById('messageList');
            if (messages.length === 0) {
                list.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:0.75rem;text-align:center;padding:10px;">还没有留言，写一句吧～</div>';
                return;
            }
            list.innerHTML = messages.map(m =>
                '<div class="message-item"><span class="message-text">' + escapeHtml(m.text) + '</span><span class="message-time">' + m.time + '</span></div>'
            ).join('');
            list.scrollTop = list.scrollHeight;
        }
        function escapeHtml(s) { return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
        function addMessage(text) {
            const now = new Date();
            const msg = { text: text, time: (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') };
            messages.push(msg);
            if (messages.length > 50) messages.shift();
            localStorage.setItem('messages', JSON.stringify(messages));
            renderMessages();
            // 联机同步
            Online.send({ type: 'message_board', text: text, time: msg.time, timestamp: Date.now() });
        }
        document.getElementById('messageSendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) { addMessage(text); input.value = ''; }
        });
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('messageSendBtn').click();
        });
        renderMessages();

        /* ---------- 模块：联机消息监听 ---------- */
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) {
                const text = indicator.querySelector('.online-text');
                if (text && data.page) {
                    const pageMap = { 'index':'星河入口','meet':'初见馆','memories':'回忆册','love':'告白屋','wish':'心愿星','secret':'秘密匣' };
                    text.textContent = 'TA在 ' + (pageMap[data.page] || data.page);
                }
            }
        });
        Online.onMessage('sys', (data) => {
            if (data.action === 'user_join') {
                // 对方加入，发送当前留言板
                Online.send({ type: 'message_board_sync', messages: messages, timestamp: Date.now() });
            }
        });
        Online.onMessage('message_board', (data) => {
            messages.push({ text: data.text, time: data.time });
            if (messages.length > 50) messages.shift();
            localStorage.setItem('messages', JSON.stringify(messages));
            renderMessages();
        });
        Online.onMessage('message_board_sync', (data) => {
            if (data.messages && Array.isArray(data.messages)) {
                messages.length = 0;
                messages.push(...data.messages);
                localStorage.setItem('messages', JSON.stringify(messages));
                renderMessages();
            }
        });

        /* ---------- 模块：烟花特效（点击空白处） ---------- */
        document.addEventListener('click', (e) => {
            // 排除按钮、链接、输入框
            if (e.target.closest('button, a, input, textarea, .jar, .photo-card, .wish-item, .timeline-item, .moon')) return;
            spawnFirework(e.clientX, e.clientY);
        });
        function spawnFirework(x, y) {
            const colors = ['#ffd700', '#ff6b9d', '#c44dff', '#00e5ff', '#fff'];
            const count = 20;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = (i / count) * Math.PI * 2;
                const dist = 30 + Math.random() * 60;
                p.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;width:4px;height:4px;border-radius:50%;background:' + color + ';box-shadow:0 0 8px ' + color + ';pointer-events:none;z-index:1000;transition:all 1s ease-out;';
                document.body.appendChild(p);
                requestAnimationFrame(() => {
                    p.style.transform = 'translate(' + Math.cos(angle) * dist + 'px,' + Math.sin(angle) * dist + 'px) scale(0)';
                    p.style.opacity = '0';
                });
                setTimeout(() => p.remove(), 1000);
            }
        }
    })();
    </script>
</body>
</html>
