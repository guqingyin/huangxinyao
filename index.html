<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05051f">
    <title>💖 星河之旅 · 七夕特典 💖</title>
    <link rel="stylesheet" href="css/style.css?v5">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="top-nav">
        <a href="index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="home-scene" id="home-scene">
        <div class="home-title">七 夕 快 乐</div>
        <div class="home-subtitle">✨ 纤云弄巧 · 飞星传恨 ✨</div>

        <!-- 倒计时卡片 -->
        <div class="countdown-card" id="countdownCard">
            <div class="countdown-label">💖 在一起</div>
            <div class="countdown-days" id="countdownDays">—</div>
            <div class="countdown-unit">天</div>
            <div class="countdown-edit" id="countdownEdit" title="设置纪念日">⚙️</div>
            <input type="date" id="anniversaryInput" style="display:none;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(10,10,40,0.9);color:#ffd700;border:1px solid rgba(255,215,0,0.3);border-radius:6px;padding:4px;font-size:0.75rem;z-index:10;">
        </div>

        <div class="star-nav">
            <div class="moon" id="moon"><span class="moon-text">🌙</span></div>
            <a href="pages/meet.html" class="star-item star-1" data-page="meet">✨<span class="star-label">初见馆</span></a>
            <a href="pages/memories.html" class="star-item star-2" data-page="memories">✨<span class="star-label">回忆册</span></a>
            <a href="pages/love.html" class="star-item star-3" data-page="love">✨<span class="star-label">告白屋</span></a>
            <a href="pages/wish.html" class="star-item star-4" data-page="wish">✨<span class="star-label">心愿星</span></a>
            <a href="pages/secret.html" class="star-item star-5" data-page="secret">✨<span class="star-label">秘密匣</span></a>
        </div>

        <!-- 留言板 -->
        <div class="message-board" id="messageBoard">
            <div class="message-board-title">📝 留言板</div>
            <div class="message-list" id="messageList"></div>
            <div class="message-form">
                <input type="text" class="message-input" id="messageInput" placeholder="写下你想说的话..." maxlength="50">
                <button class="message-send-btn" id="messageSendBtn">发送</button>
            </div>
        </div>
    </div>

    <div class="mobile-tab" id="mobileTab">
        <a href="index.html" class="active-tab"><span class="tab-icon">🏠</span>首页</a>
        <a href="pages/meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="pages/memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="pages/love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="pages/wish.html"><span class="tab-icon">⭐</span>心愿</a>
    </div>

    <script src="js/main.js?v5"></script>
    <script src="js/online.js?v5"></script>
    <script>
    (function() {
        'use strict';

        /* ---------- 模块：倒计时天数 ---------- */
        function getAnniversary() {
            return localStorage.getItem('anniversary') || '2026-08-16';
        }
        function calcDays() {
            const start = new Date(getAnniversary());
            const now = new Date();
            const diff = Math.floor((now - start) / 86400000);
            return diff >= 0 ? diff : 0;
        }
        document.getElementById('countdownDays').textContent = calcDays();

        /* ---------- 模块：纪念日设置 ---------- */
        const anniversaryInput = document.getElementById('anniversaryInput');
        const countdownEdit = document.getElementById('countdownEdit');
        anniversaryInput.value = getAnniversary();
        countdownEdit.addEventListener('click', () => {
            anniversaryInput.style.display = anniversaryInput.style.display === 'none' ? 'block' : 'none';
        });
        anniversaryInput.addEventListener('change', () => {
            const val = anniversaryInput.value;
            if (val) {
                localStorage.setItem('anniversary', val);
                document.getElementById('countdownDays').textContent = calcDays();
                anniversaryInput.style.display = 'none';
                Online.send({ type: 'anniversary_set', date: val, timestamp: Date.now() });
            }
        });
        Online.onMessage('anniversary_set', (data) => {
            if (data.date) {
                localStorage.setItem('anniversary', data.date);
                document.getElementById('countdownDays').textContent = calcDays();
            }
        });

        /* ---------- 模块：月亮彩蛋 ---------- */
        let moonClickCount = 0;
        const moon = document.getElementById('moon');
        if (moon) {
            moon.addEventListener('click', () => {
                moonClickCount++;
                if (moonClickCount >= 5) {
                    moonClickCount = 0;
                    navigateTo('secret');
                }
            });
        }

        /* ---------- 模块：导航（永久联机无房间参数） ---------- */
        function navigateTo(page) {
            const url = (page === 'index' ? 'index.html' : 'pages/' + page + '.html');
            window.location.href = url;
        }
        document.querySelectorAll('.star-item').forEach(star => {
            star.addEventListener('click', (e) => { e.preventDefault(); navigateTo(star.dataset.page); });
        });
        document.querySelectorAll('.mobile-tab a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.getAttribute('href');
                window.location.href = href;
            });
        });

        /* ---------- 模块：留言板 ---------- */
        const messages = JSON.parse(localStorage.getItem('messages') || '[]');
        function renderMessages() {
            const list = document.getElementById('messageList');
            if (messages.length === 0) {
                list.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:0.75rem;text-align:center;padding:10px;">还没有留言，写一句吧～</div>';
                return;
            }
            list.innerHTML = messages.map(m =>
                '<div class="message-item"><span class="message-text">' + escapeHtml(m.text) + '</span><span class="message-time">' + m.time + '</span></div>'
            ).join('');
            list.scrollTop = list.scrollHeight;
        }
        function escapeHtml(s) { return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
        function addMessage(text) {
            const now = new Date();
            const msg = { text: text, time: (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') };
            messages.push(msg);
            if (messages.length > 50) messages.shift();
            localStorage.setItem('messages', JSON.stringify(messages));
            renderMessages();
            Online.send({ type: 'message_board', text: text, time: msg.time, timestamp: Date.now() });
        }
        document.getElementById('messageSendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) { addMessage(text); input.value = ''; }
        });
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('messageSendBtn').click();
        });
        renderMessages();

        /* ---------- 模块：联机消息监听 ---------- */
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) {
                const text = indicator.querySelector('.online-text');
                if (text && data.page) {
                    const pageMap = { 'index':'星河入口','meet':'初见馆','memories':'回忆册','love':'告白屋','wish':'心愿星','secret':'秘密匣' };
                    if (Online.isConnected()) {
                        const myIdentity = Online.getIdentity();
                        const myName = myIdentity === 'yaya' ? '芽芽' : (myIdentity === 'yaoyao' ? '瑶瑶' : '');
                        const otherName = Online.getOtherName();
                        text.textContent = (myName || '我') + ' · 已连接 ' + otherName;
                    }
                }
            }
        });
        Online.onMessage('sys', (data) => {
            if (data.action === 'identify' || data.action === 'presence') {
                // 对方加入，发送当前留言板
                Online.send({ type: 'message_board_sync', messages: messages, timestamp: Date.now() });
            }
        });
        Online.onMessage('message_board', (data) => {
            messages.push({ text: data.text, time: data.time });
            if (messages.length > 50) messages.shift();
            localStorage.setItem('messages', JSON.stringify(messages));
            renderMessages();
        });
        Online.onMessage('message_board_sync', (data) => {
            if (data.messages && Array.isArray(data.messages)) {
                messages.length = 0;
                messages.push(...data.messages);
                localStorage.setItem('messages', JSON.stringify(messages));
                renderMessages();
            }
        });

        /* ---------- 模块：烟花特效（点击空白处） ---------- */
        document.addEventListener('click', (e) => {
            if (e.target.closest('button, a, input, textarea, .jar, .photo-card, .wish-item, .timeline-item, .moon, .star-item, #onlineIndicator')) return;
            spawnFirework(e.clientX, e.clientY);
        });
        function spawnFirework(x, y) {
            const colors = ['#ffd700', '#ff6b9d', '#c44dff', '#00e5ff', '#fff'];
            const count = 20;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = (i / count) * Math.PI * 2;
                const dist = 30 + Math.random() * 60;
                p.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;width:4px;height:4px;border-radius:50%;background:' + color + ';box-shadow:0 0 8px ' + color + ';pointer-events:none;z-index:1000;transition:all 1s ease-out;';
                document.body.appendChild(p);
                requestAnimationFrame(() => {
                    p.style.transform = 'translate(' + Math.cos(angle) * dist + 'px,' + Math.sin(angle) * dist + 'px) scale(0)';
                    p.style.opacity = '0';
                });
                setTimeout(() => p.remove(), 1000);
            }
        }
    })();
    </script>
</body>
</html>
