<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05051f">
    <title>📷 回忆册 · 星河之旅</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <a href="../index.html" class="back-btn" title="返回首页">←</a>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="scene-content">
        <div class="scene-title">回忆册</div>
        <div class="scene-desc">拍立得照片墙 · 点击翻转看心情</div>
        <div class="photo-grid" id="photoGrid"></div>
    </div>
    <div class="mobile-tab" id="mobileTab">
        <a href="../index.html"><span class="tab-icon">🏠</span>首页</a>
        <a href="meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="memories.html" class="active-tab"><span class="tab-icon">📷</span>回忆</a>
        <a href="love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="wish.html"><span class="tab-icon">⭐</span>心愿</a>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/online.js"></script>
    <script>
    (function() {
        'use strict';
        const room = Online.getRoomId();
        if (room) Online.joinRoom(room, null);
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.endsWith('.html') && !href.includes('?')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const r = Online.getRoomId();
                    window.location.href = href + (r ? '?room=' + r : '');
                });
            }
        });

        const defaultPhotos = [
            { caption: '第一次合照', back: '那天我们都笑得很傻，但我好喜欢。', rot: -6 },
            { caption: '海边日落', back: '海浪声和你的笑声，是夏天最美的旋律。', rot: 4 },
            { caption: '一起做饭', back: '虽然你切菜的样子有点笨拙，但很可爱。', rot: -2 },
            { caption: '撸猫日常', back: '以后我们一起养一只猫吧。', rot: 7 },
            { caption: '游乐园', back: '你在旋转木马上笑得像个小孩子。', rot: -5 },
            { caption: '深夜电影', back: '你靠在我肩上的时候，我什么都没看进去。', rot: 3 }
        ];
        let photos = JSON.parse(localStorage.getItem('photos') || 'null') || defaultPhotos;
        function savePhotos() { localStorage.setItem('photos', JSON.stringify(photos)); }
        function escapeHtml(s) { return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = photos.map((p, idx) =>
                '<div class="photo-card" data-idx="' + idx + '" style="transform: rotate(' + p.rot + 'deg);"><div class="photo-front"><div class="photo-placeholder"></div><span class="photo-caption">' + escapeHtml(p.caption) + '</span></div><div class="photo-back">' + escapeHtml(p.back) + '</div></div>'
            ).join('');
            grid.querySelectorAll('.photo-card').forEach(card => {
                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                    const idx = parseInt(card.dataset.idx);
                    const isFlipped = card.classList.contains('flipped');
                    Online.send({ type: 'photo_flip', index: idx, flipped: isFlipped, timestamp: Date.now() });
                });
            });
        }
        renderPhotos();

        Online.onMessage('photo_flip', (data) => {
            const cards = document.querySelectorAll('.photo-card');
            if (cards[data.index]) {
                if (data.flipped) cards[data.index].classList.add('flipped');
                else cards[data.index].classList.remove('flipped');
                cards[data.index].style.boxShadow = '0 0 30px rgba(255,107,157,0.6)';
                setTimeout(() => { cards[data.index].style.boxShadow = ''; }, 1500);
            }
        });
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) { const text = indicator.querySelector('.online-text'); if (text) text.textContent = 'TA在 ' + data.page; }
        });
    })();
    </script>
</body>
</html>
