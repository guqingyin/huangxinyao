<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05051f">
    <title>⭐ 心愿星 · 星河之旅</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <a href="../index.html" class="back-btn" title="返回首页">←</a>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="scene-content">
        <div class="scene-title">心愿星</div>
        <div class="scene-desc">点击星星点亮心愿 · 许下新愿望</div>
        <div class="wish-stats" id="wishStats">
            <span class="wish-stat-item">✨ 已点亮 <strong id="litCount">0</strong></span>
            <span class="wish-stat-item">⭐ 总愿望 <strong id="totalCount">0</strong></span>
        </div>
        <div class="wish-list" id="wishList"></div>
        <div class="add-wish-form">
            <input type="text" class="add-wish-input" id="newWishInput" placeholder="许下新的愿望..." maxlength="30">
            <button class="add-wish-btn" id="addWishBtn">许愿</button>
        </div>
    </div>
    <div class="mobile-tab" id="mobileTab">
        <a href="../index.html"><span class="tab-icon">🏠</span>首页</a>
        <a href="meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="wish.html" class="active-tab"><span class="tab-icon">⭐</span>心愿</a>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/online.js"></script>
    <script>
    (function() {
        'use strict';
        const room = Online.getRoomId();
        if (room) Online.joinRoom(room, null);
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.endsWith('.html') && !href.includes('?')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const r = Online.getRoomId();
                    window.location.href = href + (r ? '?room=' + r : '');
                });
            }
        });

        const defaultWishes = [
            { text: '一起看一次日出', lit: false },
            { text: '一起养一只猫', lit: false },
            { text: '去看一次海', lit: false },
            { text: '去迪士尼看烟花', lit: false },
            { text: '一起过下个七夕', lit: false }
        ];
        let wishes = JSON.parse(localStorage.getItem('wishes') || 'null') || defaultWishes;
        function saveWishes() { localStorage.setItem('wishes', JSON.stringify(wishes)); }
        function updateStats() {
            const lit = wishes.filter(w => w.lit).length;
            document.getElementById('litCount').textContent = lit;
            document.getElementById('totalCount').textContent = wishes.length;
        }
        function renderWishes() {
            const list = document.getElementById('wishList');
            list.innerHTML = wishes.map((w, idx) =>
                '<div class="wish-item" data-idx="' + idx + '"><span class="wish-star ' + (w.lit ? 'lit' : '') + '">' + (w.lit ? '★' : '☆') + '</span><span class="wish-text">' + escapeHtml(w.text) + '</span></div>'
            ).join('');
            list.querySelectorAll('.wish-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.idx);
                    wishes[idx].lit = !wishes[idx].lit;
                    saveWishes(); renderWishes(); updateStats();
                    if (wishes[idx].lit) spawnHearts(item);
                    Online.send({ type: 'wish_toggle', index: idx, lit: wishes[idx].lit, timestamp: Date.now() });
                });
            });
            updateStats();
        }
        function escapeHtml(s) { return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
        function spawnHearts(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top;
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.textContent = '💕';
                heart.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;font-size:' + (12 + Math.random() * 12) + 'px;pointer-events:none;z-index:1000;transition:all 1.5s ease-out;';
                document.body.appendChild(heart);
                requestAnimationFrame(() => {
                    heart.style.transform = 'translate(' + (Math.random() * 100 - 50) + 'px,-' + (50 + Math.random() * 100) + 'px) scale(0)';
                    heart.style.opacity = '0';
                });
                setTimeout(() => heart.remove(), 1500);
            }
        }
        renderWishes();

        document.getElementById('addWishBtn').addEventListener('click', () => {
            const input = document.getElementById('newWishInput');
            const text = input.value.trim();
            if (text) {
                wishes.push({ text: text, lit: false });
                saveWishes(); renderWishes();
                input.value = '';
                Online.send({ type: 'wish_add', text: text, timestamp: Date.now() });
            }
        });
        document.getElementById('newWishInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addWishBtn').click();
        });

        Online.onMessage('wish_toggle', (data) => {
            if (data.index !== undefined && wishes[data.index]) {
                wishes[data.index].lit = data.lit;
                saveWishes(); renderWishes();
                if (data.lit) {
                    const items = document.querySelectorAll('.wish-item');
                    if (items[data.index]) spawnHearts(items[data.index]);
                }
            }
        });
        Online.onMessage('wish_add', (data) => {
            if (data.text) { wishes.push({ text: data.text, lit: false }); saveWishes(); renderWishes(); }
        });
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) { const text = indicator.querySelector('.online-text'); if (text) text.textContent = 'TA在 ' + data.page; }
        });
    })();
    </script>
</body>
</html>
