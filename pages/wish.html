<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05051f">
    <title>⭐ 心愿星 · 星河之旅</title>
    <link rel="stylesheet" href="../css/style.css?v9">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <a href="../index.html" class="back-btn" title="返回首页">←</a>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="scene-content">
        <div class="scene-title">心愿星</div>
        <div class="scene-desc">点击星星点亮心愿 · 添加新愿望</div>

        <!-- 心愿列表 -->
        <div class="wish-list" id="wishList">
            <div class="wish-item" data-wish="一起看一次日出" data-lit="false">
                <span class="wish-star">☆</span><span class="wish-text">一起看一次日出</span>
            </div>
            <div class="wish-item" data-wish="一起养一只猫" data-lit="false">
                <span class="wish-star">☆</span><span class="wish-text">一起养一只猫</span>
            </div>
            <div class="wish-item" data-wish="去看一次海" data-lit="false">
                <span class="wish-star">☆</span><span class="wish-text">去看一次海</span>
            </div>
            <div class="wish-item" data-wish="去迪士尼看烟花" data-lit="false">
                <span class="wish-star">☆</span><span class="wish-text">去迪士尼看烟花</span>
            </div>
            <div class="wish-item" data-wish="一起过下个七夕" data-lit="false">
                <span class="wish-star">☆</span><span class="wish-text">一起过下个七夕</span>
            </div>
        </div>
        <div class="add-wish-form">
            <input type="text" class="add-wish-input" id="newWishInput" placeholder="许下新的愿望..." maxlength="30">
            <button class="add-wish-btn" id="addWishBtn">许愿</button>
        </div>

        <!-- 漂流瓶区域 -->
        <div class="drift-bottle-section">
            <div class="drift-bottle-title">🌊 星河漂流瓶</div>
            <div class="drift-bottle-desc">把心愿扔进星河，让TA捞到</div>
            <div class="drift-bottle-actions">
                <button class="bottle-btn throw-btn" id="throwBottleBtn">🏷️ 扔一个</button>
                <button class="bottle-btn fish-btn" id="fishBottleBtn">🎣 捞一个</button>
            </div>
            <div class="bottle-result" id="bottleResult" style="display:none;"></div>
        </div>
    </div>
    <div class="mobile-tab" id="mobileTab">
        <a href="../index.html"><span class="tab-icon">🏠</span>首页</a>
        <a href="meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="wish.html" class="active-tab"><span class="tab-icon">⭐</span>心愿</a>
    </div>
    <script src="../js/main.js?v9"></script>
    <script src="../js/online.js?v9"></script>
    <script>
    (function() {
        'use strict';

        const STORAGE_KEY = 'wishes';
        const DEFAULT_WISHES = ['一起看一次日出', '一起养一只猫', '去看一次海', '去迪士尼看烟花', '一起过下个七夕'];
        const myId = () => Online.getIdentity() || 'yaya';
        const myName = () => { const id = myId(); return id === 'yaya' ? '芽芽' : '瑶瑶'; };

        function loadWishes() {
            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (Array.isArray(raw) && raw.length) return raw;
            const seed = DEFAULT_WISHES.map(t => ({ text: t, from: null, lit: false, timestamp: 0, seed: true }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
            return seed;
        }
        function saveWishes(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
        function escText(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function escAttr(s) { return escText(s).replace(/"/g, '&quot;'); }
        function cssEsc(s) { return s.replace(/(["\\])/g, '\\$1'); }

        function buildWishNode(w) {
            const item = document.createElement('div');
            item.className = 'wish-item';
            item.dataset.wish = w.text;
            item.dataset.lit = w.lit ? 'true' : 'false';
            const from = w.from === 'yaya' ? '芽芽' : w.from === 'yaoyao' ? '瑶瑶' : '';
            const fromHtml = from ? '<span class="wish-from">— ' + from + '</span>' : '';
            const canDelete = w.from && w.from === myId();
            const deleteHtml = canDelete ? '<button class="wish-delete" data-wish="' + escAttr(w.text) + '" title="删除">×</button>' : '';
            item.innerHTML = '<span class="wish-star' + (w.lit ? ' lit' : '') + '">' + (w.lit ? '★' : '☆') + '</span><span class="wish-text">' + escText(w.text) + '</span>' + fromHtml + deleteHtml;
            item.querySelector('.wish-star').addEventListener('click', (e) => { e.stopPropagation(); toggleWish(w.text); });
            if (canDelete) {
                item.querySelector('.wish-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('删除这个心愿吗？')) deleteWish(w.text);
                });
            }
            return item;
        }

        function renderWishes() {
            const list = document.getElementById('wishList');
            list.innerHTML = '';
            loadWishes().forEach(w => list.appendChild(buildWishNode(w)));
        }

        function toggleWish(text) {
            const wishes = loadWishes();
            const w = wishes.find(x => x.text === text);
            if (!w) return;
            w.lit = !w.lit;
            saveWishes(wishes);
            renderWishes();
            if (w.lit) {
                const node = document.querySelector('.wish-item[data-wish="' + cssEsc(text) + '"]');
                if (node) spawnHearts(node);
            }
            Online.send({ type: 'wish_toggle', wish: text, lit: w.lit, timestamp: Date.now() });
        }

        function addNewWish(text) {
            const wishes = loadWishes();
            if (wishes.find(x => x.text === text)) return false;
            const item = { text: text, from: myId(), lit: false, timestamp: Date.now() };
            wishes.push(item);
            saveWishes(wishes);
            renderWishes();
            Online.send({ type: 'wish_add', item: item, timestamp: Date.now() });
            return true;
        }

        function deleteWish(text) {
            const wishes = loadWishes();
            const idx = wishes.findIndex(x => x.text === text);
            if (idx < 0) return;
            const w = wishes[idx];
            if (!w.from || w.from !== myId()) return;
            wishes.splice(idx, 1);
            saveWishes(wishes);
            renderWishes();
            Online.send({ type: 'wish_delete', text: text, timestamp: Date.now() });
        }

        function spawnHearts(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top;
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.textContent = '💕';
                heart.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;font-size:' + (12 + Math.random() * 12) + 'px;pointer-events:none;z-index:1000;transition:all 1.5s ease-out;';
                document.body.appendChild(heart);
                requestAnimationFrame(() => {
                    heart.style.transform = 'translate(' + (Math.random() * 100 - 50) + 'px,-' + (50 + Math.random() * 100) + 'px) scale(0)';
                    heart.style.opacity = '0';
                });
                setTimeout(() => heart.remove(), 1500);
            }
        }

        Online.onReady(() => renderWishes());

        document.getElementById('addWishBtn').addEventListener('click', () => {
            const input = document.getElementById('newWishInput');
            const text = input.value.trim();
            if (!text) return;
            if (text.length > 30) { alert('心愿最多 30 字哦'); return; }
            if (addNewWish(text)) input.value = '';
        });

        document.getElementById('newWishInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addWishBtn').click();
        });

        /* ---------- 模块：漂流瓶 ---------- */
        const bottleMessages = JSON.parse(localStorage.getItem('bottleMessages') || '[]');
        const myBottles = JSON.parse(localStorage.getItem('myBottles') || '[]');

        document.getElementById('throwBottleBtn').addEventListener('click', () => {
            const wish = prompt('写下你的心愿，扔进星河吧～（对方可以捞到哦）');
            if (wish && wish.trim()) {
                const bottle = {
                    text: wish.trim(),
                    time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                };
                myBottles.push(bottle);
                localStorage.setItem('myBottles', JSON.stringify(myBottles));
                // 通过联机发送
                Online.send({ type: 'bottle_throw', bottle: bottle, timestamp: Date.now() });
                showBottleResult('🏷️ 你的漂流瓶已扔进星河，等TA来捞吧～', 'throw');
            }
        });

        document.getElementById('fishBottleBtn').addEventListener('click', () => {
            if (bottleMessages.length === 0) {
                showBottleResult('🌊 星河里还没有漂流瓶，等TA扔一个过来吧～', 'empty');
            } else {
                const bottle = bottleMessages.pop();
                localStorage.setItem('bottleMessages', JSON.stringify(bottleMessages));
                showBottleResult('🎣 捞到了一个漂流瓶！\n\n"' + bottle.text + '"\n\n— ' + bottle.time, 'fish');
                // 通知对方已捞到
                Online.send({ type: 'bottle_fished', timestamp: bottle.timestamp, fishedAt: Date.now() });
            }
        });

        function showBottleResult(text, type) {
            const el = document.getElementById('bottleResult');
            el.style.display = 'block';
            el.textContent = text;
            el.className = 'bottle-result bottle-' + type;
            setTimeout(() => { el.style.transition = 'opacity 0.5s'; el.style.opacity = '0.5'; }, 5000);
            setTimeout(() => { el.style.display = 'none'; el.style.opacity = '1'; }, 8000);
        }

        Online.onMessage('bottle_throw', (data) => {
            if (data.bottle) {
                bottleMessages.push(data.bottle);
                localStorage.setItem('bottleMessages', JSON.stringify(bottleMessages));
                showBottleResult('🌊 星河漂来了一个漂流瓶！快去捞吧～', 'receive');
            }
        });

        Online.onMessage('bottle_fished', (data) => {
            showBottleResult('💕 TA 捞到了你的漂流瓶！', 'fished');
        });

        Online.onMessage('wish_toggle', (data) => {
            document.querySelectorAll('.wish-item').forEach(item => {
                if (item.dataset.wish === data.wish) {
                    const star = item.querySelector('.wish-star');
                    if (data.lit) {
                        star.classList.add('lit'); star.textContent = '★'; item.dataset.lit = 'true'; spawnHearts(item);
                    } else {
                        star.classList.remove('lit'); star.textContent = '☆'; item.dataset.lit = 'false';
                    }
                }
            });
        });

        Online.onMessage('wish_add', (data) => {
            if (!data || !data.item) return;
            const wishes = loadWishes();
            if (wishes.find(x => x.text === data.item.text)) return;
            wishes.push({ text: data.item.text, from: data.item.from, lit: !!data.item.lit, timestamp: data.item.timestamp || Date.now() });
            saveWishes(wishes);
            renderWishes();
        });

        Online.onMessage('wish_delete', (data) => {
            if (!data || !data.text) return;
            const wishes = loadWishes();
            const idx = wishes.findIndex(x => x.text === data.text);
            if (idx < 0) return;
            wishes.splice(idx, 1);
            saveWishes(wishes);
            renderWishes();
        });

        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) {
                const text = indicator.querySelector('.online-text');
                if (text) text.textContent = 'TA在 ' + data.page;
            }
        });
    })();
    </script>
</body>
</html>
