<!DOCTYPE html>
<!--
  ============================================
  二级页面：秘密匣（隐藏彩蛋）— 联机版
  ============================================
  功能：点击按钮打开惊喜兑换券
  联机：双方谁先点 5 次月亮同步触发
  ============================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05051f">
    <title>🎁 秘密匣 · 星河之旅</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Canvas 背景层 -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>

    <!-- 自定义光标 -->
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- 返回首页按钮 -->
    <a href="../index.html" class="back-btn" title="返回首页">←</a>

    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <a href="../index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>

    <!-- 场景内容：秘密匣 -->
    <div class="scene-content">
        <div class="scene-title">秘密匣</div>
        <div class="scene-desc">你发现了隐藏彩蛋！</div>

        <div class="secret-box">
            <!-- 打开惊喜按钮 -->
            <button class="secret-btn" id="revealSecret">打开惊喜</button>

            <!-- 惊喜内容显示区 -->
            <div id="secretContent"></div>
        </div>
    </div>

    <!-- 底部移动导航 -->
    <div class="mobile-tab" id="mobileTab">
        <a href="../index.html"><span class="tab-icon">🏠</span>首页</a>
        <a href="meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="wish.html"><span class="tab-icon">⭐</span>心愿</a>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/online.js"></script>
    <script>
    (function() {
        'use strict';

        /* ---------- 模块：联机初始化 ---------- */
        const room = Online.getRoomId();
        if (room) {
            Online.connect(room, null);
            Online.notifyPageChange();
        }

        // 导航链接加 room 参数
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.endsWith('.html') && !href.includes('?')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const r = Online.getRoomId();
                    window.location.href = href + (r ? '?room=' + r : '');
                });
            }
        });

        /* ---------- 模块：秘密匣打开惊喜 ---------- */
        document.getElementById('revealSecret').addEventListener('click', () => {
            const content = document.getElementById('secretContent');

            // 渲染兑换券 + 语音播放按钮
            content.innerHTML = `
                <div class="voucher">
                    <p style="font-size:1.2rem; margin-bottom:8px;">💌 兑换券</p>
                    <p>「免费耍赖一次券」</p>
                    <p>「呼叫马上出现券」</p>
                    <p style="margin-top:8px;">我爱你，不止七夕。</p>
                </div>
                <button class="voice-btn" id="playVoice">🔊 播放语音</button>
            `;

            /* ---------- 模块：语音播放（模拟） ---------- */
            document.getElementById('playVoice').addEventListener('click', () => {
                alert('（这里可以嵌入你的录音文件，现在只是模拟）');
            });

            // 联机同步：告诉对方我打开了惊喜
            Online.send({
                type: 'secret_reveal',
                timestamp: Date.now()
            });
        });

        /* ---------- 模块：接收对方消息 ---------- */
        // 对方打开了惊喜
        Online.onMessage('secret_reveal', () => {
            const content = document.getElementById('secretContent');
            if (!content.innerHTML) {
                content.innerHTML = `
                    <div class="voucher" style="border-color:#ff6b9d;">
                        <p style="font-size:1.2rem; margin-bottom:8px;">💌 兑换券</p>
                        <p>「免费耍赖一次券」</p>
                        <p>「呼叫马上出现券」</p>
                        <p style="margin-top:8px;">我爱你，不止七夕。</p>
                    </div>
                    <p style="color:#ff6b9d;font-size:0.8rem;margin-top:8px;">✨ TA 打开了惊喜</p>
                `;
            }
        });

        // 对方页面切换
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) {
                const text = indicator.querySelector('.online-text');
                if (text) text.textContent = 'TA在 ' + data.page;
            }
        });
    })();
    </script>
</body>
</html>
