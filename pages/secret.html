<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05051f">
    <title>🎁 秘密匣 · 星河之旅</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <a href="../index.html" class="back-btn" title="返回首页">←</a>
    <div class="top-nav">
        <a href="../index.html" class="nav-btn" title="星河入口">🏠</a>
        <div class="nav-btn music-btn" id="musicToggle" title="背景音乐">♪</div>
    </div>
    <div class="scene-content">
        <div class="scene-title">秘密匣</div>
        <div class="scene-desc">你发现了隐藏彩蛋！</div>
        <div class="secret-box">
            <button class="secret-btn" id="revealSecret">打开惊喜</button>
            <div id="secretContent"></div>
        </div>
    </div>
    <div class="mobile-tab" id="mobileTab">
        <a href="../index.html"><span class="tab-icon">🏠</span>首页</a>
        <a href="meet.html"><span class="tab-icon">📖</span>初见</a>
        <a href="memories.html"><span class="tab-icon">📷</span>回忆</a>
        <a href="love.html"><span class="tab-icon">💌</span>告白</a>
        <a href="wish.html"><span class="tab-icon">⭐</span>心愿</a>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/online.js"></script>
    <script>
    (function() {
        'use strict';
        const room = Online.getRoomId();
        if (room) Online.joinRoom(room, null);
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.endsWith('.html') && !href.includes('?')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const r = Online.getRoomId();
                    window.location.href = href + (r ? '?room=' + r : '');
                });
            }
        });

        document.getElementById('revealSecret').addEventListener('click', () => {
            const content = document.getElementById('secretContent');
            content.innerHTML = '<div class="voucher"><p style="font-size:1.2rem;margin-bottom:8px;">💌 兑换券</p><p>「免费耍赖一次券」</p><p>「呼叫马上出现券」</p><p>「无条件抱抱券」</p><p style="margin-top:8px;">我爱你，不止七夕。</p></div>';
            // 烟花特效
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const x = window.innerWidth * (0.2 + Math.random() * 0.6);
                    const y = window.innerHeight * (0.2 + Math.random() * 0.3);
                    spawnFirework(x, y);
                }, i * 300);
            }
            Online.send({ type: 'secret_reveal', timestamp: Date.now() });
        });

        function spawnFirework(x, y) {
            const colors = ['#ffd700', '#ff6b9d', '#c44dff', '#00e5ff', '#fff'];
            const count = 24;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = (i / count) * Math.PI * 2;
                const dist = 40 + Math.random() * 80;
                p.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;width:4px;height:4px;border-radius:50%;background:' + color + ';box-shadow:0 0 8px ' + color + ';pointer-events:none;z-index:1000;transition:all 1.2s ease-out;';
                document.body.appendChild(p);
                requestAnimationFrame(() => {
                    p.style.transform = 'translate(' + Math.cos(angle) * dist + 'px,' + Math.sin(angle) * dist + 'px) scale(0)';
                    p.style.opacity = '0';
                });
                setTimeout(() => p.remove(), 1200);
            }
        }

        Online.onMessage('secret_reveal', () => {
            const content = document.getElementById('secretContent');
            if (!content.innerHTML) {
                content.innerHTML = '<div class="voucher" style="border-color:#ff6b9d;"><p style="font-size:1.2rem;margin-bottom:8px;">💌 兑换券</p><p>「免费耍赖一次券」</p><p>「呼叫马上出现券」</p><p>「无条件抱抱券」</p><p style="margin-top:8px;">我爱你，不止七夕。</p></div><p style="color:#ff6b9d;font-size:0.8rem;margin-top:8px;">✨ TA 打开了惊喜</p>';
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const x = window.innerWidth * (0.2 + Math.random() * 0.6);
                        const y = window.innerHeight * (0.2 + Math.random() * 0.3);
                        spawnFirework(x, y);
                    }, i * 300);
                }
            }
        });
        Online.onMessage('page_change', (data) => {
            const indicator = document.getElementById('onlineIndicator');
            if (indicator) { const text = indicator.querySelector('.online-text'); if (text) text.textContent = 'TA在 ' + data.page; }
        });
    })();
    </script>
</body>
</html>
